name: Build Telegram APK

on:
  workflow_dispatch: # اجرای دستی بیلد

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (Optimized for GitHub Runner)
        # استفاده از دستورات کنترلی برای جلوگیری از کرش سرور
        run: |
          ./gradlew :TMessagesProj_App:assembleDebug \
          -Pandroid.injected.abi.list=arm64-v8a \
          -Pandroid.bundle.enableSplit=false \
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError" \
          --max-workers=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Infinity-Debug-APK
          path: TMessagesProj_App/build/outputs/apk/debug/*.apk
