name: Build and Sign Telegram

on:
  push:
    branches: [ "master" ] # اگر شاخه اصلی شما نام دیگری دارد آن را جایگزین کنید

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant permissions for Gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Sign Android Release
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: Telegram-Custom-Signed
        path: ${{ steps.sign_app.outputs.signedReleaseFile }}
    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Telegram-Custom-Signed
        path: ${{ steps.sign_app.outputs.signedReleas
eFile }}
