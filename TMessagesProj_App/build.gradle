apply plugin: 'com.android.application'

repositories {
    google()
    mavenCentral()
}

android {
    compileSdkVersion 35
    buildToolsVersion '35.0.0'
    namespace 'org.infinity.tel' // نام جدید شما

    defaultConfig {
        applicationId "org.infinity.tel"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        ndkVersion "21.4.7075529"
        multiDexEnabled true

        externalNativeBuild {
            cmake {
                version '3.10.2'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21'
            }
        }
    }

    sourceSets {
        main {
            // این دو خط بسیار مهم هستند تا جاوا و مانیفست درست جفت شوند
            java.srcDirs = ['../TMessagesProj/src/main/java']
            manifest.srcFile '../TMessagesProj/config/release/AndroidManifest.xml'
            jniLibs.srcDirs = ['../TMessagesProj/jni/']
        }
    }

    signingConfigs {
        release {
            storeFile file("../TMessagesProj/config/release.keystore")
            storePassword 'android' 
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false // فعلاً این را false بگذار تا سرعت بالا برود و خطا کمتر شود
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    implementation project(':TMessagesProj')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('../TMessagesProj/libs/libgsaverification-client.aar')
}
