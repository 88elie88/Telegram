apply plugin: 'com.android.application'

// این خط را برای عبور از خطای گوگل غیرفعال کردیم
// apply plugin: 'com.google.gms.google-services'

android {
    compileSdkVersion 35
    buildToolsVersion '35.0.0'
    
    // شناسنامه جدید برنامه تو
    namespace 'org.infinity.tel'

    defaultConfig {
        applicationId "org.infinity.tel"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        ndkVersion "21.4.7075529"
        multiDexEnabled true

        externalNativeBuild {
            cmake {
                version '3.10.2'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21'
            }
        }
    }

    signingConfigs {
        release {
            storeFile file("../TMessagesProj/config/release.keystore")
            // استفاده از متغیرهای محیطی گیت‌هاب برای امنیت
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "ph_password"
            keyAlias System.getenv("KEY_ALIAS") ?: "ph_alias"
            keyPassword System.getenv("KEY_PASSWORD") ?: "ph_password"
        }
    }

    buildTypes {
        release {
            debuggable false
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro'
        }
    }

    // تلگرام به این مسیرها برای پیدا کردن کدهای اصلی نیاز دارد
    sourceSets {
        main {
            jniLibs.srcDirs = ['../TMessagesProj/jni/']
            manifest.srcFile '../TMessagesProj/config/release/AndroidManifest.xml'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    implementation project(':TMessagesProj')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    // فایل کتابخانه داخلی تلگرام
    implementation files('../TMessagesProj/libs/libgsaverification-client.aar')
}

// تنظیم نام فایل خروجی برای دانلود راحتتر
applicationVariants.all { variant ->
    variant.outputs.all { output ->
        outputFileName = "infinity-telegram.apk"
    }
}
