apply plugin: 'com.android.application'

// مخازن لازم برای دانلود ا
repositories {
    google()
    mavenCentral()
}

android {
    compileSdkVersion 35
    buildToolsVersion '35.0.0'
    
    // این بخش باید دقیقاً با نام پکیج شما یکی باشد
    namespace 'org.infinity.tel'

    defaultConfig {
        applicationId "org.infinity.tel"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        ndkVersion "21.4.7075529"
        multiDexEnabled true

        externalNativeBuild {
            cmake {
                version '3.10.2'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21'
            }
        }
    }

    signingConfigs {
        release {
            storeFile file("../TMessagesProj/config/release.keystore")
            storePassword 'android' 
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['../TMessagesProj/jni/']
            // مسیر مانیفست اصلی تلگرام
            manifest.srcFile '../TMessagesProj/config/release/AndroidManifest.xml'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    // تغییر نا
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "infinity-telegram.apk"
        }
    }
}

dependencies {
    implementation project(':TMessagesProj')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('../TMessagesProj/libs/libgsaverification-client.aar')
}
